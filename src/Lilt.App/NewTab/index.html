<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; form-action https://duckduckgo.com">
<title>Home</title>
<!--
  Lilt's home tab, served locally as https://newtab.lilt.example/ with no access to Lilt itself.
  Lilt refreshes these files on start. Put your changes in custom.css and custom.js beside them;
  lilt-data.json (theme colors, layout switches, bookmark tiles) is rewritten whenever they change.
-->
<link rel="stylesheet" href="home.css">
<link rel="stylesheet" href="custom.css">
</head>
<body>
<main>
  <section id="clock" hidden>
    <p class="time" id="time"></p>
    <p class="date" id="date"></p>
  </section>
  <form id="search" action="https://duckduckgo.com/" method="get" role="search" hidden>
    <input name="q" placeholder="Search the web" aria-label="Search the web" autocomplete="off">
  </form>
  <nav id="tiles" aria-label="Bookmarks" hidden></nav>
  <p class="hint">Ctrl+T new tab · Ctrl+L address · Ctrl+D bookmark · Ctrl+Shift+B sidebar</p>
</main>
<script src="home.js"></script>
<script src="custom.js"></script>
</body>
</html>
