<!doctype html>
<meta charset="utf-8">
<title>Lilt media test</title>
<!-- For CI: a looping 10-second tone with media-session metadata, plus a silent animated video (for picture in picture). -->
<style>body{margin:0;background:#171a1e;color:#f3f4f1;font:16px system-ui;display:grid;place-items:center;height:100vh}video{width:480px;background:#000}</style>
<audio id="a" loop></audio>
<div><p>Lilt media test</p><video id="v" muted playsinline></video></div>
<script>
const rate = 22050, n = rate * 10, buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
const tag = (o, s) => [...s].forEach((ch, i) => dv.setUint8(o + i, ch.charCodeAt(0)));
tag(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); tag(8, 'WAVE'); tag(12, 'fmt ');
dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, rate, true);
dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); tag(36, 'data'); dv.setUint32(40, n * 2, true);
for (let i = 0; i < n; i++) {
  const t = i / rate, f = 220 * Math.pow(2, (Math.floor(t * 2) % 8) / 4);
  dv.setInt16(44 + i * 2, Math.sin(2 * Math.PI * f * t) * 12000 * (0.6 + 0.4 * Math.sin(t * 3)), true);
}
const a = document.getElementById('a');
a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
navigator.mediaSession.metadata = new MediaMetadata({ title: 'Lilt test tone', artist: 'Lilt CI', album: 'Smoke tests' });
a.play().catch(e => document.title = 'autoplay blocked: ' + e.message);

const c = Object.assign(document.createElement('canvas'), { width: 480, height: 270 }), g = c.getContext('2d');
let x = 0;
setInterval(() => { g.fillStyle = '#263'; g.fillRect(0, 0, 480, 270); g.fillStyle = '#8db5a4'; g.fillRect(x = (x + 6) % 480, 100, 60, 60); }, 33);
const v = document.getElementById('v');
v.srcObject = c.captureStream(30);
v.play();
</script>
