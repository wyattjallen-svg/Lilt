<!doctype html>
<meta charset="utf-8">
<title>Lilt session test</title>
<!-- For CI: plays the way Spotify's web player does. Its media element is made with createElement and never put in the
     document, so all the page shows is its media session (title, artist, play and pause handlers). A minute-long tone. -->
<style>body{margin:0;background:#171a1e;color:#f3f4f1;font:16px system-ui;display:grid;place-items:center;height:100vh}</style>
<p>Lilt session test</p>
<script>
const rate = 22050, n = rate * 60, buf = new ArrayBuffer(44 + n * 2), dv = new DataView(buf);
const tag = (o, s) => [...s].forEach((ch, i) => dv.setUint8(o + i, ch.charCodeAt(0)));
tag(0, 'RIFF'); dv.setUint32(4, 36 + n * 2, true); tag(8, 'WAVE'); tag(12, 'fmt ');
dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true); dv.setUint32(24, rate, true);
dv.setUint32(28, rate * 2, true); dv.setUint16(32, 2, true); dv.setUint16(34, 16, true); tag(36, 'data'); dv.setUint32(40, n * 2, true);
for (let i = 0; i < n; i++) {
  const t = i / rate, f = 196 * Math.pow(2, (Math.floor(t * 2) % 8) / 4);
  dv.setInt16(44 + i * 2, Math.sin(2 * Math.PI * f * t) * 12000 * (0.6 + 0.4 * Math.sin(t * 3)), true);
}
const player = document.createElement('video');
player.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
player.loop = true;
navigator.mediaSession.metadata = new MediaMetadata({ title: 'Lilt session tone', artist: 'Lilt CI', album: 'Smoke tests' });
navigator.mediaSession.setActionHandler('play', () => player.play());
navigator.mediaSession.setActionHandler('pause', () => player.pause());
player.play().catch(e => document.title = 'autoplay blocked: ' + e.message);
</script>
