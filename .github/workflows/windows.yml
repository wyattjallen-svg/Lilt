name: Windows build

on:
  push:
    branches: [main, prototype]
    tags: ['v*']
    # Notes and docs alone don't need a Windows build (Windows minutes are the expensive ones).
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

# Read-only by default; the build job below gets write access for its releases only.
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Enables the developer switches the smoke tests use (--run, --user-data, --browser-args...). Off in releases.
      LILT_DEV: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Core tests
        run: dotnet run --project tests/Lilt.Core.Tests -c Release

      - name: Publish (self-contained, ReadyToRun)
        shell: pwsh
        run: |
          dotnet publish src/Lilt.App/Lilt.App.csproj -c Release -r win-x64 -p:Platform=x64 -o out/Lilt 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/Lilt/* -DestinationPath Lilt-win-x64.zip
          $zip = (Get-Item Lilt-win-x64.zip).Length / 1MB
          $raw = (Get-ChildItem out/Lilt -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          $files = (Get-ChildItem out/Lilt -Recurse -File).Count
          "{0:N1} MB zipped, {1:N1} MB unpacked, {2} files" -f $zip, $raw, $files | Tee-Object size.txt
          Get-ChildItem out/Lilt -File | Sort-Object Length -Descending | Select-Object -First 25 Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table | Out-String | Add-Content size.txt

      - name: WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (-not (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile wv2setup.exe
            Start-Process .\wv2setup.exe -ArgumentList '/silent', '/install' -Wait
          }
          "WebView2 runtime: $((Get-ItemProperty $key).pv)"

      - name: Smoke test and screenshots
        shell: pwsh
        timeout-minutes: 25
        run: |
          $script:failed = @()
          $script:checks = @()
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -Namespace Lilt -Name Input -MemberDefinition @'
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);
          [DllImport("user32.dll")] public static extern bool SetForegroundWindow(System.IntPtr h);
          [DllImport("user32.dll")] public static extern bool ShowWindow(System.IntPtr h, int cmd);
          '@
          # Windows Server ships with transparency effects off; turn them on so the glass themes can show.
          $personalize = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (-not (Test-Path $personalize)) { New-Item $personalize -Force | Out-Null }
          Set-ItemProperty $personalize EnableTransparency 1 -Type DWord
          function Shot([string]$path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = [System.Drawing.Bitmap]::new($b.Width, $b.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $PWD $path))
            $g.Dispose(); $bmp.Dispose()
          }
          function Check([string]$name, [bool]$ok, [string]$detail) {
            $script:checks += "| $name | $(if ($ok) { 'pass' } else { 'FAIL' }) | $detail |"
            if (-not $ok) { Write-Host "::warning::$name failed: $detail" }
          }
          # Starts Lilt with a fresh data folder, waits for the first page, runs $during, screenshots, closes. Returns the data folder.
          function Smoke([string]$name, [string[]]$extra, [scriptblock]$during = $null, [int]$settle = 6, [switch]$warm) {
            $dir = Join-Path $env:RUNNER_TEMP "lilt-$name"
            $report = Join-Path $dir 'startup.json'
            New-Item -ItemType Directory $dir -Force | Out-Null
            $argList = @('--user-data', "`"$dir`"", '--startup-report', "`"$report`"") + $extra
            if ($warm) {
              # A first launch installs the ad blocker; the measured launch is the second one.
              $w = Start-Process (Resolve-Path out/Lilt/Lilt.exe) -ArgumentList $argList -PassThru
              Start-Sleep -Seconds 30
              if (-not $w.HasExited) { [void]$w.CloseMainWindow(); if (-not $w.WaitForExit(15000)) { Stop-Process -Id $w.Id -Force } }
              Remove-Item $report, "$report.keys.txt" -ErrorAction SilentlyContinue
            }
            $p = Start-Process (Resolve-Path out/Lilt/Lilt.exe) -ArgumentList $argList -PassThru
            $deadline = (Get-Date).AddSeconds(120)
            while (-not (Test-Path $report) -and -not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            Start-Sleep -Seconds $settle
            if ($during -and -not $p.HasExited) { & $during $p }
            try { Shot "screenshot-$name.png" } catch { Write-Host "::warning::screenshot failed: $_" }
            $alive = -not $p.HasExited
            if (Test-Path $report) { Copy-Item $report "smoke-$name.json"; Get-Content $report | Out-Host }
            if (Test-Path "$report.keys.txt") { Copy-Item "$report.keys.txt" "smoke-$name.keys.txt" }
            else { Write-Host "::warning::$name produced no startup report (exited: $($p.HasExited))" }
            # Lilt's log (about:logs): kept for every run; an error in it fails the run.
            $errors = @()
            if (Test-Path "$dir/logs/lilt.log") {
              Copy-Item "$dir/logs/lilt.log" "smoke-$name.log"
              $errors = @(Get-Content "$dir/logs/lilt.log" | Where-Object { $_ -match '"level":"error"' })
              if ($errors.Count) { Write-Host "::warning::$name logged $($errors.Count) error(s)"; $errors | Out-Host }
            }
            if ($alive) {
              [void]$p.CloseMainWindow()
              if (-not $p.WaitForExit(15000)) { Stop-Process -Id $p.Id -Force; $script:checks += "| $name closes within 15 s | FAIL | had to be killed |"; Write-Host "::warning::$name didn't exit after closing" }
            }
            else { Write-Host "::error::$name exited early with code $($p.ExitCode)" }
            $nav = if (Test-Path $report) { Get-Content $report -Raw | ConvertFrom-Json } else { $null }
            $loaded = $nav -and $nav.firstNavigationSucceeded
            # The runner's network sometimes can't reach a site: noted as a failed check, not a failed build.
            $offline = $nav -and -not $loaded -and $nav.firstNavigationStatus -in 'Timeout', 'CannotConnect', 'HostNameNotResolved', 'ConnectionAborted', 'ConnectionReset', 'Disconnected', 'ServerUnreachable'
            if (-not $loaded) { Write-Host "::$(if ($offline) { 'warning' } else { 'error' })::$name first page did not load ($(if ($nav) { $nav.firstNavigationStatus } else { 'no report' }))" }
            if ($offline) { $script:checks += "| $name reaches its first page | FAIL | network: $($nav.firstNavigationStatus) |" }
            if (-not $alive -or (-not $loaded -and -not $offline) -or $errors.Count) { $script:failed += $name }
            Write-Host "$name alive=$alive report=$(Test-Path $report)"
            return $dir
          }
          # Follows a --run script through the keys file: a screenshot at each "mark <name>", until "run done".
          # (-until <mark> returns at that mark, so the test can act there; marks already shot aren't shot again.)
          $script:shots = @{}
          function Follow([string]$name, [int]$timeout = 150, [string]$until = '') {
            $keys = Join-Path $env:RUNNER_TEMP "lilt-$name/startup.json.keys.txt"
            $deadline = (Get-Date).AddSeconds($timeout)
            while ((Get-Date) -lt $deadline) {
              $lines = if (Test-Path $keys) { @(Get-Content $keys) } else { @() }
              foreach ($l in $lines) { if ($l -match ' run mark (\S+)$' -and -not $script:shots["$name-$($Matches[1])"]) { $script:shots["$name-$($Matches[1])"] = $true; try { Shot "screenshot-$name-$($Matches[1]).png" } catch { } } }
              if ($until -and ($lines -match " run mark $until$")) { return }
              if ($lines -match ' run done') { return }
              Start-Sleep -Milliseconds 250
            }
            Write-Host "::warning::$name script didn't finish"
          }
          function States([string]$name) {
            $keys = Join-Path $env:RUNNER_TEMP "lilt-$name/startup.json.keys.txt"
            if (-not (Test-Path $keys)) { return @() }
            @(Get-Content $keys | Where-Object { $_ -match '^\d+ state ' } | ForEach-Object { ($_ -split ' state ', 2)[1] | ConvertFrom-Json })
          }
          function Extensions([string]$name) {
            if (Test-Path "smoke-$name.json") { @((Get-Content "smoke-$name.json" -Raw | ConvertFrom-Json).extensions) } else { @() }
          }

          # The runner's first WebView2 start can be slow enough to miss the report, so a throwaway launch goes first.
          [void](Smoke 'newtab' @() -settle 25 -warm)
          $ubol = Extensions 'newtab'
          Check 'uBlock Origin Lite installed' ([bool]($ubol -match 'uBlock')) ($ubol -join '; ')
          [void](Smoke 'dusk-page' @('--url', 'https://example.com'))
          # The themes copied to a scratch file, so Customize-panel saves can't touch the build output.
          foreach ($t in 'glass', 'light') { Copy-Item "out/Lilt/Themes/$t.json" (Join-Path $env:RUNNER_TEMP "$t.json") }
          [void](Smoke 'light-page' @('--theme', "`"$env:RUNNER_TEMP\light.json`"", '--url', 'https://example.com'))
          [void](Smoke 'light-home' @('--theme', "`"$env:RUNNER_TEMP\light.json`""))
          [void](Smoke 'glass-home' @('--theme', "`"$env:RUNNER_TEMP\glass.json`""))
          $glass = if (Test-Path 'smoke-glass-home.json') { (Get-Content 'smoke-glass-home.json' -Raw | ConvertFrom-Json).backdrop } else { '' }
          Check 'Glass theme gets its acrylic material' ($glass -like 'Acrylic*') "backdrop: $glass"

          # Efficiency mode: cover Lilt with a full-screen window (like a game), then minimize it; it should pause
          # (hide and suspend pages, EcoQoS) and come back to normal each time it's in front again.
          $dir = Smoke 'power' @('--url', 'https://example.com') {
            param($p)
            $p.Refresh()
            $cover = @'
          Add-Type -AssemblyName System.Windows.Forms
          $f = New-Object System.Windows.Forms.Form
          $f.FormBorderStyle = 'None'; $f.WindowState = 'Maximized'; $f.TopMost = $true; $f.BackColor = 'Black'; $f.Text = 'Game'
          $t = New-Object System.Windows.Forms.Timer; $t.Interval = 40000; $t.Add_Tick({ $f.Close() }); $t.Start()
          [System.Windows.Forms.Application]::Run($f)
          '@
            $coverFile = Join-Path $env:RUNNER_TEMP 'cover.ps1'
            Set-Content $coverFile $cover
            $c = Start-Process pwsh -ArgumentList '-NoProfile', '-File', "`"$coverFile`"" -PassThru
            Start-Sleep -Seconds 38
            try { Shot 'screenshot-power-covered.png' } catch { }
            $c.WaitForExit(15000) | Out-Null
            [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle)
            Start-Sleep -Seconds 3
            [void][Lilt.Input]::ShowWindow($p.MainWindowHandle, 6)
            Start-Sleep -Seconds 30
            [void][Lilt.Input]::ShowWindow($p.MainWindowHandle, 9)
            [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle)
            Start-Sleep -Seconds 3
          }
          $dir = @($dir)[-1]
          $power = if (Test-Path "$dir/startup.json.keys.txt") { @(Get-Content "$dir/startup.json.keys.txt" | Where-Object { $_ -match ' power ' }) } else { @() }
          if ($power) { $power | Set-Content 'smoke-power.txt' }
          Check 'Efficiency mode pauses behind a full-screen window and when minimized' (($power -match 'power paused').Count -ge 2) ($power -join ' / ')
          Check 'Paused pages get suspended' ([bool]($power -match 'suspended')) ($power -join ' / ')
          Check 'Efficiency mode returns to normal in front' ([bool]($power[-1] -match 'power full')) "last: $(if ($power) { $power[-1] } else { 'none' })"
          # A user script (Lilt's per-site JS) scrolls the tester to its score so the screenshot shows it.
          $userDir = Join-Path $env:RUNNER_TEMP 'lilt-adblock-test/user'
          New-Item -ItemType Directory $userDir -Force | Out-Null
          Set-Content (Join-Path $userDir 'adblock-tester.com.js') @'
          addEventListener('load', () => setTimeout(() => {
            document.documentElement.style.zoom = '0.6';
            const el = [...document.querySelectorAll('h1,h2,h3,h4,p,div,span')].find(e => /your score|points/i.test(e.textContent) && e.children.length < 3);
            (el || document.body).scrollIntoView({ block: 'start' });
          }, 12000));
          '@
          [void](Smoke 'adblock-test' @('--url', 'https://adblock-tester.com/') -settle 22 -warm)

          # From the home tab (address box focused): Ctrl+T as a XAML accelerator, then type a site into the new tab,
          # click into that page and press Ctrl+T again (the in-page key shim). Closing should save three tabs.
          $dir = Smoke 'keys-session' @() {
            param($p)
            $p.Refresh()
            [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle)
            Start-Sleep -Seconds 1
            [System.Windows.Forms.SendKeys]::SendWait('^t')
            Start-Sleep -Seconds 3
            [System.Windows.Forms.SendKeys]::SendWait('example.com{ENTER}')
            Start-Sleep -Seconds 5
            [void][Lilt.Input]::SetCursorPos(640, 420)
            [Lilt.Input]::mouse_event(2, 0, 0, 0, 0); [Lilt.Input]::mouse_event(4, 0, 0, 0, 0)
            Start-Sleep -Seconds 1
            [System.Windows.Forms.SendKeys]::SendWait('^t')
            Start-Sleep -Seconds 3
          }
          $dir = @($dir)[-1]
          $keys = if (Test-Path "$dir/startup.json.keys.txt") { Get-Content "$dir/startup.json.keys.txt" } else { @() }
          $session = if (Test-Path "$dir/session.json") { Get-Content "$dir/session.json" -Raw | ConvertFrom-Json } else { $null }
          if ($session) { Copy-Item "$dir/session.json" 'smoke-keys-session.session.json' }
          $urls = if ($session) { ($session.tabs | ForEach-Object url) -join ', ' } else { 'no session.json' }
          Check 'Ctrl+T from the address box (XAML)' ([bool]($keys -match 'xaml newTab')) "keys: $($keys -join ' / ')"
          Check 'Ctrl+T from inside a page (key shim)' ([bool]($keys -match 'page newTab')) "keys: $($keys -join ' / ')"
          Check 'Session saved on close' ($session -and $session.tabs.Count -eq 3) "tabs: $urls"

          # Media, widgets, split view, pop-out, peek and the palette, driven by a --run script on a local test page
          # (a looping tone with media-session metadata and a silent animated video).
          $mdir = Join-Path $env:RUNNER_TEMP 'lilt-media'
          New-Item -ItemType Directory "$mdir/newtab" -Force | Out-Null
          Copy-Item tools/media-test.html "$mdir/newtab/media-test.html"
          Start-Service Audiosrv -ErrorAction SilentlyContinue
          $script = 'wait 4000; probe; state; mark playing; wait 1000; newTab; wait 2500; state; mark player; wait 1000; visualizer; wait 4000; state; mark visualizer; wait 1000; ' +
            'prevTab; wait 1500; split; wait 3000; state; mark split; wait 1000; split; wait 1000; pip; wait 3000; state; mark pip; wait 1500; pip; wait 1000; ' +
            'peek https://example.com; wait 4000; state; mark peek; wait 1000; closePeek; palette; wait 1500; state; mark palette; wait 1000'
          [void](Smoke 'media' @('--url', 'https://newtab.lilt.example/media-test.html', '--browser-args', '"--autoplay-policy=no-user-gesture-required"', '--run', "`"$script`"") { param($p) $p.Refresh(); [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle); Follow 'media' } -settle 1)
          $s = States 'media'
          Get-Content (Join-Path $mdir 'startup.json.keys.txt') -ErrorAction SilentlyContinue | Where-Object { $_ -match ' (probe|pip|visualizer|media) ' } | Set-Content smoke-media-probe.txt
          $probe = if (Test-Path smoke-media-probe.txt) { (Get-Content smoke-media-probe.txt) -join ' / ' } else { 'none' }
          Check 'Media reported from the page (title, artist)' ($s.Count -gt 0 -and $s[0].media.Title -eq 'Lilt test tone' -and $s[0].media.Artist -eq 'Lilt CI') "$(if ($s.Count) { $s[0].media | ConvertTo-Json -Compress })"
          Check 'A short audible element is the track, not the media session' ($s.Count -gt 0 -and $s[0].media.Playing -and -not $s[0].media.Session -and $s[0].media.Duration -gt 9) "$(if ($s.Count) { $s[0].media | ConvertTo-Json -Compress })"
          Check 'Player stays hidden while the playing tab is on screen' ($s.Count -gt 0 -and -not $s[0].player) "$(if ($s.Count) { $s[0] | ConvertTo-Json -Compress })"
          Check 'Player shows when the playing tab is out of sight' ($s.Count -gt 1 -and $s[1].player) "$(if ($s.Count -gt 1) { $s[1] | ConvertTo-Json -Compress })"
          Check 'Visualizer draws from Lilt''s sound or the page' ($s.Count -gt 2 -and $s[2].visualizer -and $s[2].visualizerFrames -gt 10 -and $s[2].visualizerSource -ne 'none') "$(if ($s.Count -gt 2) { $s[2] | ConvertTo-Json -Compress })"
          Check 'Visualizer hears sound' ($s.Count -gt 2 -and $s[2].visualizerPeak -gt 0.05) "peak $(if ($s.Count -gt 2) { $s[2].visualizerPeak })"
          Check 'Split view pairs two tabs' ($s.Count -gt 3 -and $s[3].split -ge 0) "$(if ($s.Count -gt 3) { $s[3] | ConvertTo-Json -Compress })"
          Check 'Picture in picture or pop-out' ($s.Count -gt 4 -and ($s[4].floating -ge 0 -or $s[4].media.PictureInPicture)) "$(if ($s.Count -gt 4) { $s[4] | ConvertTo-Json -Compress })"
          Check 'Peek opens a link over the page' ($s.Count -gt 5 -and $s[5].peek) "$(if ($s.Count -gt 5) { $s[5] | ConvertTo-Json -Compress })"
          Check 'Command palette opens' ($s.Count -gt 6 -and $s[6].palette) "$(if ($s.Count -gt 6) { $s[6] | ConvertTo-Json -Compress })"
          Check 'Engine capabilities (info)' $true $probe

          # Pop-out inside Lilt (media.pip.show "always"): the tab floats in a frame over the page you switch to, then goes back.
          $pt = Join-Path $env:RUNNER_TEMP 'popout-theme.json'
          (Get-Content out/Lilt/Themes/minimal.json -Raw) -replace '"pip": \{ "show": "auto"', '"pip": { "show": "always"' | Set-Content $pt
          $pdir = Join-Path $env:RUNNER_TEMP 'lilt-popout'
          New-Item -ItemType Directory "$pdir/newtab" -Force | Out-Null
          Copy-Item tools/media-test.html "$pdir/newtab/media-test.html"
          # The frame is dragged by its bar (real mouse input) while the script waits; the new place is saved to the theme.
          $script = 'wait 4000; pip; wait 3000; state; mark floating; wait 6000; state; mark dragged; wait 1000; pip; wait 1500; state'
          [void](Smoke 'popout' @('--theme', "`"$pt`"", '--url', 'https://newtab.lilt.example/media-test.html', '--browser-args', '"--autoplay-policy=no-user-gesture-required"', '--run', "`"$script`"") {
            param($p)
            $p.Refresh(); [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle)
            $deadline = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $deadline -and @(States 'popout').Count -lt 1) { Start-Sleep -Milliseconds 300 }
            $first = @(States 'popout')[0]
            if ($first.pipBar) {
              Start-Sleep -Seconds 1
              $x = $first.pipBar[0]; $y = $first.pipBar[1]
              [void][Lilt.Input]::SetCursorPos($x, $y - 2); Start-Sleep -Milliseconds 100
              [void][Lilt.Input]::SetCursorPos($x, $y); Start-Sleep -Milliseconds 100
              [Lilt.Input]::mouse_event(2, 0, 0, 0, 0); Start-Sleep -Milliseconds 100
              # Relative moves go through the input queue like a real mouse.
              foreach ($i in 1..12) { [Lilt.Input]::mouse_event(1, -15, -8, 0, 0); Start-Sleep -Milliseconds 40 }
              [Lilt.Input]::mouse_event(4, 0, 0, 0, 0)
            }
            Follow 'popout'
          } -settle 1)
          $s = States 'popout'
          Check 'Video pops out into a frame inside Lilt' ($s.Count -gt 0 -and $s[0].floating -ge 0 -and $s[0].active -ne $s[0].floating) "$(if ($s.Count) { $s[0] | ConvertTo-Json -Compress })"
          $moved = $s.Count -gt 1 -and $s[0].pipBar -and $s[1].pipBar -and ($s[0].pipBar[0] - $s[1].pipBar[0]) -gt 100
          $saved = (Get-Content $pt -Raw) -match '"pip":\s*\{[^}]*"x":\s*([0-9.]+)'
          $savedX = if ($saved) { [double]$Matches[1] } else { -1 }
          Check 'Dragging the frame moves it and saves the place to the theme' ($moved -and $savedX -ge 0 -and $savedX -lt 0.59) "bar $(if ($s.Count -gt 1) { "$($s[0].pipBar -join ',') -> $($s[1].pipBar -join ',')" }), theme x $savedX"
          Check 'Popped-out video goes back' ($s.Count -gt 2 -and $s[2].floating -lt 0) "$(if ($s.Count -gt 2) { $s[2] | ConvertTo-Json -Compress })"

          # Everyday use: a Chrome password export must not become bookmarks (and bookmarks an earlier import left behind
          # are found); typing completes a visited site; Ctrl+click opens behind; searches use the chosen engine (Google sometimes
          # answers CI's address with its robot check, which still carries the search).
          $qdir = Join-Path $env:RUNNER_TEMP 'lilt-everyday'
          New-Item -ItemType Directory $qdir -Force | Out-Null
          Set-Content (Join-Path $qdir 'bookmarks.json') '[{"title":"accounts.google.com","url":"https://accounts.google.com/signin","folder":""},{"title":"https://x.example/login","url":"https://x.example/login","folder":""},{"title":"Real one","url":"https://real.example/","folder":""}]'
          $csv = Join-Path $env:RUNNER_TEMP 'Chrome Passwords.csv'
          Set-Content $csv "name,url,username,password,note`naccounts.google.com,https://accounts.google.com/signin,me,secret1,`n,https://x.example/login,me2,secret2,"
          $gt = Join-Path $env:RUNNER_TEMP 'google-theme.json'
          (Get-Content out/Lilt/Themes/minimal.json -Raw) -replace '"search": "duckduckgo"', '"search": "google"' | Set-Content $gt
          # The middle-click is real mouse input on the page's link, placed from the link's position the script reports.
          $script = "wait 3000; import $csv; wait 1500; state; mark import; wait 1000; go example.com; wait 4000; newTab; wait 1500; type exa; wait 1500; state; mark suggest; wait 1000; " +
            "prevTab; dismiss; wait 2000; eval (document.querySelector('a').scrollIntoView({block: 'center'}), JSON.stringify(document.querySelector('a').getBoundingClientRect())); wait 500; state; mark click; wait 4000; state; mark behind; wait 500; " +
            "go lilt browser; wait 3000; state"
          [void](Smoke 'everyday' @('--theme', "`"$gt`"", '--run', "`"$script`"") {
            param($p)
            $p.Refresh(); [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle)
            $keys = Join-Path $env:RUNNER_TEMP 'lilt-everyday/startup.json.keys.txt'
            Follow 'everyday' -timeout 90 -until 'click'
            $rect = @(Get-Content $keys | Where-Object { $_ -match '^\d+ eval \{' } | ForEach-Object { ($_ -split ' eval ', 2)[1] | ConvertFrom-Json })[-1]
            $st = @(States 'everyday')[-1]
            if ($rect -and $st.page) {
              $x = [int]($st.page[0] + $rect.x + [math]::Min(20, $rect.width / 2)); $y = [int]($st.page[1] + $rect.y + $rect.height / 2)
              [void][Lilt.Input]::SetCursorPos($x, $y); Start-Sleep -Milliseconds 200
              [Lilt.Input]::mouse_event(0x20, 0, 0, 0, 0); Start-Sleep -Milliseconds 80; [Lilt.Input]::mouse_event(0x40, 0, 0, 0, 0)
            }
            Follow 'everyday'
          } -settle 1)
          $s = States 'everyday'
          Check 'A password export imports no bookmarks and offers to remove ones it left before' ($s.Count -gt 0 -and $s[0].bookmarks -eq 3 -and $s[0].noticeAction -eq 'Remove those 2') "$(if ($s.Count) { "$($s[0].bookmarks) bookmarks; $($s[0].notice) [$($s[0].noticeAction)]" })"
          Check 'Typing completes a visited site and suggests it' ($s.Count -gt 1 -and $s[1].address -eq 'example.com' -and ($s[1].suggestions -contains 'Example Domain')) "$(if ($s.Count -gt 1) { "address '$($s[1].address)'; suggestions: $($s[1].suggestions -join ' | ')" })"
          Check 'Middle-click opens a link in a tab behind' ($s.Count -gt 3 -and $s[3].tabs -eq 3 -and $s[3].active -eq 0) "$(if ($s.Count -gt 3) { "tabs $($s[2].tabs) -> $($s[3].tabs), active $($s[3].active)" })"
          Check 'Searches use the chosen engine' ($s.Count -gt 4 -and ($s[4].url -like 'https://www.google.com/search?q=lilt*' -or $s[4].url -like 'https://www.google.com/sorry/*search%3Fq%3Dlilt*')) "$(if ($s.Count -gt 4) { $s[4].url })"

          # Shortcuts from the theme: the palette moved to Ctrl+Shift+Y, split view's shortcut removed.
          $kt = Join-Path $env:RUNNER_TEMP 'keys-theme.json'
          (Get-Content out/Lilt/Themes/minimal.json -Raw) -replace '"shortcuts": \{\}', '"shortcuts": { "palette": "Ctrl+Shift+Y", "split": "" }' | Set-Content $kt
          [void](Smoke 'custom-keys' @('--theme', "`"$kt`"", '--url', 'https://example.com') {
            param($p)
            $p.Refresh()
            [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle)
            Start-Sleep -Seconds 1
            [void][Lilt.Input]::SetCursorPos(640, 420)
            [Lilt.Input]::mouse_event(2, 0, 0, 0, 0); [Lilt.Input]::mouse_event(4, 0, 0, 0, 0)
            Start-Sleep -Seconds 1
            [System.Windows.Forms.SendKeys]::SendWait('^+s')
            Start-Sleep -Seconds 1
            [System.Windows.Forms.SendKeys]::SendWait('^+y')
            Start-Sleep -Seconds 2
            try { Shot 'screenshot-custom-keys-palette.png' } catch { }
            [System.Windows.Forms.SendKeys]::SendWait('{ESC}')
            Start-Sleep -Seconds 1
            [System.Windows.Forms.SendKeys]::SendWait('^+y')
            Start-Sleep -Seconds 2
          })
          $ck = if (Test-Path smoke-custom-keys.keys.txt) { @(Get-Content smoke-custom-keys.keys.txt) } else { @() }
          Check 'A shortcut changed in the theme works in pages and in Lilt' ([bool]($ck -match '(page|xaml) palette')) ($ck -join ' / ')
          Check 'A shortcut removed in the theme does nothing' (-not ($ck -match ' split$')) ($ck -join ' / ')

          # v0.6: see-through websites, the bookmark manager, a whole-page screenshot, workspaces, the window lift, a mouse
          # gesture (a real right-button drag, placed from the page position the state reports) and a site asking for a permission.
          $script = 'wait 3000; go example.com; wait 4500; eval JSON.stringify([getComputedStyle(document.documentElement).backgroundColor, getComputedStyle(document.body).backgroundColor]); state; mark glass; wait 500; ' +
            'bookmark; bookmarks; wait 1500; state; mark manager; wait 500; bookmarks; screenshot; wait 3000; dismiss; workspace Work; wait 2500; state; mark workspace; wait 500; ' +
            'workspace Main; wait 2000; state; lift; wait 600; state; mark lifted; lift off; wait 800; mark gesture; wait 3500; state; mark back; wait 500; ' +
            'eval (navigator.geolocation.getCurrentPosition(() => 0, () => 0), 1); wait 2500; state; mark permission'
          $vdir = Smoke 'v06' @('--theme', "`"$env:RUNNER_TEMP\glass.json`"", '--run', "`"$script`"") {
            param($p)
            $p.Refresh(); [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle)
            Follow 'v06' -timeout 90 -until 'gesture'
            $st = @(States 'v06')[-1]
            if ($st.page) {
              $x = [int]$st.page[0] + 500; $y = [int]$st.page[1] + 300
              [void][Lilt.Input]::SetCursorPos($x, $y); Start-Sleep -Milliseconds 150
              [Lilt.Input]::mouse_event(8, 0, 0, 0, 0); Start-Sleep -Milliseconds 80
              foreach ($i in 1..10) { [Lilt.Input]::mouse_event(1, -15, 0, 0, 0); Start-Sleep -Milliseconds 30 }
              [Lilt.Input]::mouse_event(0x10, 0, 0, 0, 0)
            }
            Follow 'v06'
          } -settle 1
          $vdir = @($vdir)[-1]
          $s = States 'v06'
          $vk = if (Test-Path smoke-v06.keys.txt) { @(Get-Content smoke-v06.keys.txt) } else { @() }
          $bg = @($vk | Where-Object { $_ -match '^\d+ eval \[' } | ForEach-Object { ($_ -split ' eval ', 2)[1] | ConvertFrom-Json })
          $alpha = if ($bg.Count -ge 1 -and $bg[0] -match 'rgba\([^,]+,[^,]+,[^,]+,\s*([0-9.]+)\)') { [double]$Matches[1] } else { 1 }
          Check 'See-through websites: the page lets the window material show' ($alpha -lt 1) "root, body: $($bg -join ' | ')"
          Check 'Bookmark manager opens with the bookmarks' ($s.Count -gt 1 -and $s[1].manager -ge 1) "$(if ($s.Count -gt 1) { "manager: $($s[1].manager)" })"
          Check 'Whole-page screenshot saved' ([bool]($vk -match ' screenshot \d+ bytes')) (($vk -match ' screenshot ') -join ' / ')
          Check 'Workspaces keep their own tabs' ($s.Count -gt 3 -and $s[2].workspace -eq 'Work' -and $s[2].tabs -eq 1 -and $s[2].allTabs -eq 2 -and $s[3].workspace -eq 'Main' -and $s[3].url -like '*example.com*') "$(if ($s.Count -gt 3) { "$($s[2].workspace): $($s[2].tabs)/$($s[2].allTabs); $($s[3].workspace): $($s[3].url)" })"
          $vs = if (Test-Path "$vdir/session.json") { Get-Content "$vdir/session.json" -Raw | ConvertFrom-Json } else { $null }
          Check 'Workspaces are saved with the session' ($vs -and ($vs.workspaces -contains 'Work') -and @($vs.tabs | Where-Object workspace -eq 'Work').Count -eq 1) "$(if ($vs) { ($vs.tabs | ForEach-Object { "$($_.workspace):$($_.url)" }) -join ', ' })"
          Check 'Window lifts while dragged (motion.windowDrag)' ($s.Count -gt 4 -and $s[4].lifted) "$(if ($s.Count -gt 4) { "lifted: $($s[4].lifted)" })"
          Check 'Mouse gesture (right-drag left) goes back' ($s.Count -gt 5 -and $s[5].url -notlike '*example.com*' -and ($vk -match 'gesture back')) "$(if ($s.Count -gt 5) { $s[5].url }) / $(($vk -match 'gesture') -join ' / ')"
          Check 'A site asks before using your location' ($s.Count -gt 6 -and $s[6].permission) "$(if ($s.Count -gt 6) { $s[6].permission })"
          $drm = @(Get-Content smoke-media-probe.txt -ErrorAction SilentlyContinue | Where-Object { $_ -match 'probe page \{' } | ForEach-Object { (($_ -split 'probe page ', 2)[1] | ConvertFrom-Json).drm })
          Check 'Protected content (DRM) key systems (info)' $true "$(if ($drm) { ($drm[0].PSObject.Properties | ForEach-Object { "$($_.Name -replace 'com\.microsoft\.|com\.|org\.w3\.', ''): $($_.Value)" }) -join '; ' } else { 'no probe' })"

          # v0.7: the playing tab moves into the panel and keeps playing, the visualizer docks under it, the toolbar takes a
          # page's theme-color, emptying caches keeps cookies (sign-ins), and the panel is saved with the session.
          $sdir = Join-Path $env:RUNNER_TEMP 'lilt-v07'
          New-Item -ItemType Directory "$sdir/newtab" -Force | Out-Null
          Copy-Item tools/media-test.html "$sdir/newtab/media-test.html"
          $script = 'wait 4000; toPanel; wait 3000; state; mark panel; visualizer; wait 2500; state; mark docked; wait 500; go example.com; wait 4000; ' +
            "eval (document.head.insertAdjacentHTML('beforeend', '<meta name=theme-color content=#3366cc>'), document.cookie = 'lilt=1', 1); wait 2000; state; mark color; wait 500; " +
            'tidy caches; wait 1000; eval document.cookie; state; panel; wait 1500; state; mark hidden'
          $sdir = Smoke 'v07' @('--url', 'https://newtab.lilt.example/media-test.html', '--browser-args', '"--autoplay-policy=no-user-gesture-required"', '--run', "`"$script`"") {
            param($p); $p.Refresh(); [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle); Follow 'v07'
          } -settle 1
          $sdir = @($sdir)[-1]
          $s = States 'v07'
          $sk = if (Test-Path smoke-v07.keys.txt) { @(Get-Content smoke-v07.keys.txt) } else { @() }
          Check 'A playing tab moves into the panel and keeps playing' ($s.Count -gt 0 -and $s[0].panel -eq 1 -and $s[0].tabs -eq 1 -and $s[0].media.Playing -and $s[0].panelUrl -like '*media-test*') "$(if ($s.Count) { "panel $($s[0].panel), tabs $($s[0].tabs), playing $($s[0].media.Playing), $($s[0].panelUrl)" })"
          Check 'The visualizer docks under the panel' ($s.Count -gt 1 -and $s[1].docked -like '*visualizer*' -and $s[1].visualizer) "$(if ($s.Count -gt 1) { "docked '$($s[1].docked)', visualizer $($s[1].visualizer)" })"
          Check 'The toolbar takes the page''s theme-color' ($s.Count -gt 2 -and $s[2].siteColor -eq '#3366CC' -and $s[2].tint -and $s[2].tint -notlike '#00*') "$(if ($s.Count -gt 2) { "site $($s[2].siteColor), tint $($s[2].tint)" })"
          Check 'Emptying caches keeps cookies (you stay signed in)' ([bool]($sk -match ' eval lilt=1') -and [bool]($sk -match ' storage cache ')) (($sk -match ' (storage|eval) ') -join ' / ')
          Check 'Hiding the panel keeps it playing and lets the visualizer float' ($s.Count -gt 4 -and $s[4].panel -eq -1 -and $s[4].docked -eq '' -and $s[4].media.Playing) "$(if ($s.Count -gt 4) { "panel $($s[4].panel), docked '$($s[4].docked)', playing $($s[4].media.Playing)" })"
          $ss = if (Test-Path "$sdir/session.json") { Get-Content "$sdir/session.json" -Raw | ConvertFrom-Json } else { $null }
          Check 'The panel is saved with the session' ($ss -and @($ss.panel).Count -eq 1 -and @($ss.panel)[0].url -like '*media-test*') "$(if ($ss) { ($ss.panel | ForEach-Object url) -join ', ' })"

          # v0.8: a wipe asked for last time runs at start (keeping bookmarks, leaving files that aren't Lilt's), background
          # tabs sleep and wake, the memory list fills in, and the wipe dialog (with its keypad) opens.
          $wdir = Join-Path $env:RUNNER_TEMP 'lilt-v08'
          New-Item -ItemType Directory $wdir -Force | Out-Null
          Set-Content (Join-Path $wdir 'bookmarks.json') '[{"title":"Kept","url":"https://kept.example/","folder":""}]'
          Set-Content (Join-Path $wdir 'session.json') '{"tabs":[{"url":"https://example.com/","title":"A"},{"url":"https://example.org/","title":"B"}],"active":1}'
          Set-Content (Join-Path $wdir 'notes.txt') 'not Lilt''s'
          Set-Content (Join-Path $wdir 'wipe.json') '{"keep":["bookmarks"],"pid":0}'
          $script = 'wait 3000; state; mark fresh; go example.com; wait 3500; open https://example.org; wait 3500; sleepTabs; wait 1500; state; mark asleep; ' +
            'memory; wait 500; state; mark memory; prevTab; wait 3500; state; wipe; wait 1500; state; mark dialog; closedialog; wait 500'
          $wdir = Smoke 'v08' @('--run', "`"$script`"") { param($p); $p.Refresh(); [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle); Follow 'v08' } -settle 1
          $wdir = @($wdir)[-1]
          $s = States 'v08'
          Check 'A wipe runs at start: fresh tabs, bookmarks kept as asked, other files untouched' ($s.Count -gt 0 -and $s[0].tabs -eq 1 -and $s[0].url -like '*newtab*' -and $s[0].bookmarks -eq 1 -and $s[0].wiped -eq '' -and (Test-Path "$wdir/notes.txt") -and -not (Test-Path "$wdir/wipe.json")) "$(if ($s.Count) { "tabs $($s[0].tabs), $($s[0].url), bookmarks $($s[0].bookmarks), left '$($s[0].wiped)'" }), notes.txt $(Test-Path "$wdir/notes.txt"), marker $(Test-Path "$wdir/wipe.json")"
          Check 'Background tabs sleep (their page closes)' ($s.Count -gt 1 -and $s[1].asleep -eq 1 -and $s[1].tabs -eq 2) "$(if ($s.Count -gt 1) { "asleep $($s[1].asleep) of $($s[1].tabs)" })"
          Check 'What''s using memory lists the engine''s processes' ($s.Count -gt 2 -and $s[2].memoryRows -ge 3) "$(if ($s.Count -gt 2) { "rows $($s[2].memoryRows)" })"
          Check 'A sleeping tab wakes when opened' ($s.Count -gt 3 -and $s[3].asleep -eq 0 -and $s[3].url -like '*example.com*') "$(if ($s.Count -gt 3) { "asleep $($s[3].asleep), $($s[3].url)" })"
          Check 'The wipe dialog opens and waits for the code' ($s.Count -gt 4 -and $s[4].dialog -like 'Wipe everything*') "$(if ($s.Count -gt 4) { $s[4].dialog })"

          # v0.10: about:logs shows Lilt's log (typed in the address bar), and a web page can't open it.
          $script = "wait 2500; go about:logs; wait 3000; state; eval document.title + ' ' + document.querySelectorAll('#log li').length; mark logs; wait 500; " +
            "go example.com; wait 3500; eval (location.href = 'https://about.lilt.example/logs', 1); wait 3000; state; mark guarded"
          [void](Smoke 'v10' @('--run', "`"$script`"") { param($p); $p.Refresh(); [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle); Follow 'v10' } -settle 1)
          $s = States 'v10'
          $lk = if (Test-Path smoke-v10.keys.txt) { @(Get-Content smoke-v10.keys.txt) } else { @() }
          Check 'about:logs opens Lilt''s log' ($s.Count -gt 0 -and $s[0].url -like '*about.lilt.example/logs*' -and [bool]($lk -match ' eval Logs · Lilt [1-9]')) "$(if ($s.Count) { "$($s[0].url), address '$($s[0].address)'" }) / $(($lk -match ' eval ') -join ' / ')"
          Check 'A web page can''t open Lilt''s own pages' ($s.Count -gt 1 -and $s[1].url -like '*example.com*') "$(if ($s.Count -gt 1) { "$($s[1].url), notice '$($s[1].notice)'" })"
          $ll = if (Test-Path smoke-v10.log) { @(Get-Content smoke-v10.log) } else { @() }
          Check 'Lilt logs its start' ([bool]($ll -match '"level":"info".*started')) "$($ll.Count) lines"

          # v0.10: interface size. At 125% the toolbar, sidebar, player (and what's in it), Customize and the palette all grow
          # together; at 80% they shrink together.
          foreach ($size in @(@{ name = 'scale'; value = '1.25' }, @{ name = 'scale-small'; value = '0.8' })) {
            $sn = $size.name
            $st = Join-Path $env:RUNNER_TEMP "$sn-theme.json"
            (Get-Content out/Lilt/Themes/minimal.json -Raw) -replace '"scale": 1,', "`"scale`": $($size.value)," | Set-Content $st
            New-Item -ItemType Directory "$env:RUNNER_TEMP/lilt-$sn/newtab" -Force | Out-Null
            Copy-Item tools/media-test.html "$env:RUNNER_TEMP/lilt-$sn/newtab/media-test.html"
            $script = 'wait 4000; open example.com; wait 3500; state; mark player; wait 1200; customize; wait 1500; mark customize; wait 1500; palette; wait 1200; mark palette; wait 1200'
            [void](Smoke $sn @('--theme', "`"$st`"", '--url', 'https://newtab.lilt.example/media-test.html', '--browser-args', '"--autoplay-policy=no-user-gesture-required"', '--run', "`"$script`"") {
              param($p); $p.Refresh(); [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle); Follow $sn
            } -settle 1)
          }
          $s = States 'scale'
          Check 'Interface size 125%: the toolbar and the player grow together' ($s.Count -gt 0 -and $s[0].scale -eq 1.25 -and $s[0].toolbarHeight -ge 48 -and $s[0].player -and $s[0].playerWidth -ge 360) "$(if ($s.Count) { "scale $($s[0].scale), toolbar $($s[0].toolbarHeight), player $($s[0].player) $($s[0].playerWidth)" })"
          $s = States 'scale-small'
          Check 'Interface size 80%: the toolbar and the player shrink together' ($s.Count -gt 0 -and $s[0].scale -eq 0.8 -and $s[0].toolbarHeight -le 34 -and $s[0].player -and $s[0].playerWidth -le 250) "$(if ($s.Count) { "scale $($s[0].scale), toolbar $($s[0].toolbarHeight), player $($s[0].player) $($s[0].playerWidth)" })"

          # v0.11: a player whose media element isn't in the page (as Spotify's isn't) shows in Now playing with its time from
          # Windows' media controls, which also play and pause it; the visualizer hears it as system sound; and docked, the
          # panel is a column: the player's artwork as wide as the panel and the visualizer filling the rest.
          New-Item -ItemType Directory "$env:RUNNER_TEMP/lilt-session/newtab" -Force | Out-Null
          Copy-Item tools/session-test.html "$env:RUNNER_TEMP/lilt-session/newtab/session-test.html"
          $script = 'wait 4000; open example.com; wait 4500; state; mark playing; visualizer; wait 7000; state; mark visualizer; panel; wait 2500; state; mark column; ' +
            'playPause; wait 3000; state; mark paused'
          [void](Smoke 'session' @('--url', 'https://newtab.lilt.example/session-test.html', '--browser-args', '"--autoplay-policy=no-user-gesture-required"', '--run', "`"$script`"") {
            param($p); $p.Refresh(); [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle); Follow 'session'
          } -settle 1)
          $s = States 'session'
          Check 'A player outside the page (like Spotify''s) shows in Now playing' ($s.Count -gt 0 -and $s[0].media.Title -eq 'Lilt session tone' -and $s[0].media.Playing -and $s[0].player) "$(if ($s.Count) { $s[0].media | ConvertTo-Json -Compress })"
          Check 'Its time comes from Windows'' media controls' ($s.Count -gt 1 -and $s[1].media.Duration -ge 50) "$(if ($s.Count -gt 1) { "duration $($s[1].media.Duration)" })"
          # The runner has no sound card, so Windows can't loop its sound back; this records what the visualizer got.
          Check 'What the visualizer gets from system sound (info: the runner has no sound card)' $true "$(if ($s.Count -gt 1) { "$($s[1].visualizerSource), peak $($s[1].visualizerPeak), $($s[1].visualizerSystem)" })"
          Check 'Docked, the player and visualizer fill the panel' ($s.Count -gt 2 -and $s[2].docked -like '*visualizer*' -and $s[2].docked -like '*player*' -and $s[2].visualizer) "$(if ($s.Count -gt 2) { "docked '$($s[2].docked)', visualizer $($s[2].visualizer)" })"
          Check 'Play and pause reach it through Windows'' media controls' ($s.Count -gt 3 -and -not $s[3].media.Playing) "$(if ($s.Count -gt 3) { $s[3].media | ConvertTo-Json -Compress })"
          $sl = if (Test-Path smoke-session.log) { @(Get-Content smoke-session.log | Where-Object { $_ -match '"source":"visualizer"' }) } else { @() }
          Check 'What the visualizer heard is in about:logs (info)' $true "$($sl -join ' / ')"

          [void](Smoke 'proton-pass' @('--install-extension', 'ghmbeldphafepmbegfdlkpapadhbakde') -settle 4)
          $pp = Extensions 'proton-pass'
          Check 'Proton Pass installs from the Chrome Web Store' ([bool]($pp -match 'Proton')) ($pp -join '; ')

          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-20) } -ErrorAction SilentlyContinue |
            Format-List TimeCreated, ProviderName, Message | Out-File smoke-events.log
          @('### Feature checks', '', '| Check | Result | Detail |', '|---|---|---|') + $script:checks | Tee-Object smoke-checks.md | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($script:failed.Count) { Write-Host "::error::Smoke test failed: $($script:failed -join ', ')"; exit 1 }

      # A release for each new version: pushing a tag, or reaching main with a <Version> that has no release yet.
      - name: Publish release
        if: github.ref_type == 'tag' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else {
            'v' + @(([xml](Get-Content src/Lilt.App/Lilt.App.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ })[0]
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { "Release $tag already exists."; exit 0 }
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path $notes)) { "Lilt $tag" | Set-Content $notes }
          Copy-Item Lilt-win-x64.zip "Lilt-$tag-win-x64.zip"
          $files = @("Lilt-$tag-win-x64.zip", 'size.txt', 'smoke-checks.md') + @(Get-ChildItem screenshot-*.png -ErrorAction SilentlyContinue | ForEach-Object Name)
          foreach ($try in 1..5) {
            gh release create $tag --target $env:GITHUB_SHA --title "Lilt $tag" --notes-file $notes --latest @files
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (10 * $try)
            gh release delete $tag --yes 2>$null
          }
          exit 1

      - name: Publish prerelease
        if: github.ref == 'refs/heads/prototype'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'prototype-build'
          gh release delete $tag --yes --cleanup-tag 2>$null
          $files = @('Lilt-win-x64.zip', 'size.txt') + @(Get-ChildItem screenshot-*.png, measure-*.json, measure-*.md, smoke-*.json, smoke-*.log, smoke-*.md, smoke-*.txt -ErrorAction SilentlyContinue | ForEach-Object Name)
          # Recreating a just-deleted tag sometimes fails for a few seconds; retry.
          foreach ($try in 1..5) {
            gh release create $tag --prerelease --target $env:GITHUB_SHA --title "Lilt prototype build $($env:GITHUB_SHA.Substring(0, 7))" --notes "Built by CI from $env:GITHUB_SHA on $env:GITHUB_REF_NAME. Unzip anywhere and run Lilt.exe (Windows 11 x64)." @files
            if ($LASTEXITCODE -eq 0) { exit 0 }
            gh release delete $tag --yes --cleanup-tag 2>$null
            Start-Sleep -Seconds (10 * $try)
          }
          exit 1

      - name: Idle measurements
        # About 15 minutes of runner time, so only when asked: a manual run, or "[measure]" in the commit message.
        if: github.ref == 'refs/heads/prototype' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[measure]'))
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 30
        run: |
          # Each scenario runs in its own process with a hard time limit, so one stuck run can't hold up the rest.
          # (Not named Measure: that's an alias for Measure-Object, and aliases win over functions.)
          function Invoke-Scenario([string]$out, [string[]]$a) {
            $argList = @('-NoProfile', '-File', 'tools/measure.ps1', '-Exe', 'out/Lilt/Lilt.exe', '-Runs', '3', '-Settle', '20', '-Sample', '30', '-Out', $out) + $a
            $m = Start-Process pwsh -ArgumentList $argList -NoNewWindow -PassThru
            if (-not $m.WaitForExit(480000)) {
              Write-Host "::warning::$out timed out"
              Stop-Process -Id $m.Id -Force -ErrorAction SilentlyContinue
              Get-Process Lilt, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }
          Invoke-Scenario measure-visible.json @('-Label', '"CI runner, about:blank, first start"')
          Invoke-Scenario measure-noext.json @('-Label', '"CI runner, about:blank, no extensions"', '-ExtraArgs', '--no-extensions')
          # A page that animates continuously (Lilt's bundled canvas bench; software-rendered on this GPU-less VM), so background savings show up.
          $page = 'https://newtab.lilt.example/bench.html'
          $off = Join-Path $env:RUNNER_TEMP 'efficiency-off.json'
          (Get-Content out/Lilt/Themes/minimal.json -Raw) -replace '"efficiency": true', '"efficiency": false' | Set-Content $off
          Invoke-Scenario measure-front.json @('-Url', $page, '-Warm', '-Label', '"CI runner, animated page, in front"')
          Invoke-Scenario measure-covered.json @('-Url', $page, '-Warm', '-Cover', '-Label', '"CI runner, animated page, behind a full-screen window, efficiency mode on"')
          Invoke-Scenario measure-occluded.json @('-Url', $page, '-Warm', '-Occlude', '-Label', '"CI runner, animated page, behind another app''s maximized window"')
          Invoke-Scenario measure-minimized.json @('-Url', $page, '-Warm', '-Minimize', '-AfterMinimize', '20', '-Label', '"CI runner, animated page, minimized"')
          Invoke-Scenario measure-covered-off.json @('-Url', $page, '-Warm', '-Cover', '-Theme', "`"$off`"", '-Label', '"CI runner, animated page, behind a full-screen window, efficiency mode off"')
          Get-Content measure-*.md -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Add measurements to the release
        if: always() && github.ref == 'refs/heads/prototype' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[measure]'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem measure-*.json, measure-*.md -ErrorAction SilentlyContinue | ForEach-Object Name)
          if ($files) { gh release upload prototype-build @files --clobber }

      - name: Upload log on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prototype-log --yes --cleanup-tag 2>$null
          if (-not (Test-Path build.log)) { 'No build log (failure before publish).' | Set-Content build.log }
          $files = @('build.log') + @(Get-ChildItem screenshot-*.png, smoke-*.json, smoke-*.log, smoke-*.txt, smoke-*.md -ErrorAction SilentlyContinue | ForEach-Object Name)
          foreach ($try in 1..5) {
            gh release create prototype-log --prerelease --target $env:GITHUB_SHA --title "CI log $($env:GITHUB_SHA.Substring(0, 7))" --notes "Failed run $env:GITHUB_RUN_ID" @files
            if ($LASTEXITCODE -eq 0) { exit 0 }
            gh release delete prototype-log --yes --cleanup-tag 2>$null
            Start-Sleep -Seconds (10 * $try)
          }
          exit 1
