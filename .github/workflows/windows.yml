name: Windows build

on:
  push:
    branches: [main, prototype]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Core tests
        run: dotnet run --project tests/Lilt.Core.Tests -c Release

      - name: Publish (self-contained, ReadyToRun)
        shell: pwsh
        run: |
          dotnet publish src/Lilt.App/Lilt.App.csproj -c Release -r win-x64 -p:Platform=x64 -o out/Lilt 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path out/Lilt/* -DestinationPath Lilt-win-x64.zip
          $zip = (Get-Item Lilt-win-x64.zip).Length / 1MB
          $raw = (Get-ChildItem out/Lilt -Recurse -File | Measure-Object Length -Sum).Sum / 1MB
          $files = (Get-ChildItem out/Lilt -Recurse -File).Count
          "{0:N1} MB zipped, {1:N1} MB unpacked, {2} files" -f $zip, $raw, $files | Tee-Object size.txt
          Get-ChildItem out/Lilt -File | Sort-Object Length -Descending | Select-Object -First 25 Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table | Out-String | Add-Content size.txt

      - name: WebView2 runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (-not (Get-ItemProperty $key -ErrorAction SilentlyContinue).pv) {
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile wv2setup.exe
            Start-Process .\wv2setup.exe -ArgumentList '/silent', '/install' -Wait
          }
          "WebView2 runtime: $((Get-ItemProperty $key).pv)"

      - name: Smoke test and screenshots
        shell: pwsh
        timeout-minutes: 25
        run: |
          $script:failed = @()
          $script:checks = @()
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type -Namespace Lilt -Name Input -MemberDefinition @'
          [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
          [DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);
          [DllImport("user32.dll")] public static extern bool SetForegroundWindow(System.IntPtr h);
          [DllImport("user32.dll")] public static extern bool ShowWindow(System.IntPtr h, int cmd);
          '@
          # Windows Server ships with transparency effects off; turn them on so the glass themes can show.
          $personalize = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (-not (Test-Path $personalize)) { New-Item $personalize -Force | Out-Null }
          Set-ItemProperty $personalize EnableTransparency 1 -Type DWord
          function Shot([string]$path) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = [System.Drawing.Bitmap]::new($b.Width, $b.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $PWD $path))
            $g.Dispose(); $bmp.Dispose()
          }
          function Check([string]$name, [bool]$ok, [string]$detail) {
            $script:checks += "| $name | $(if ($ok) { 'pass' } else { 'FAIL' }) | $detail |"
            if (-not $ok) { Write-Host "::warning::$name failed: $detail" }
          }
          # Starts Lilt with a fresh data folder, waits for the first page, runs $during, screenshots, closes. Returns the data folder.
          function Smoke([string]$name, [string[]]$extra, [scriptblock]$during = $null, [int]$settle = 6, [switch]$warm) {
            $dir = Join-Path $env:RUNNER_TEMP "lilt-$name"
            $report = Join-Path $dir 'startup.json'
            New-Item -ItemType Directory $dir -Force | Out-Null
            $argList = @('--user-data', "`"$dir`"", '--startup-report', "`"$report`"") + $extra
            if ($warm) {
              # A first launch installs the ad blocker; the measured launch is the second one.
              $w = Start-Process (Resolve-Path out/Lilt/Lilt.exe) -ArgumentList $argList -PassThru
              Start-Sleep -Seconds 30
              if (-not $w.HasExited) { [void]$w.CloseMainWindow(); if (-not $w.WaitForExit(15000)) { Stop-Process -Id $w.Id -Force } }
              Remove-Item $report, "$report.keys.txt" -ErrorAction SilentlyContinue
            }
            $p = Start-Process (Resolve-Path out/Lilt/Lilt.exe) -ArgumentList $argList -PassThru
            $deadline = (Get-Date).AddSeconds(120)
            while (-not (Test-Path $report) -and -not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 500 }
            Start-Sleep -Seconds $settle
            if ($during -and -not $p.HasExited) { & $during $p }
            try { Shot "screenshot-$name.png" } catch { Write-Host "::warning::screenshot failed: $_" }
            $alive = -not $p.HasExited
            if (Test-Path $report) { Copy-Item $report "smoke-$name.json"; Get-Content $report | Out-Host }
            if (Test-Path "$report.keys.txt") { Copy-Item "$report.keys.txt" "smoke-$name.keys.txt" }
            else { Write-Host "::warning::$name produced no startup report (exited: $($p.HasExited))" }
            if (Test-Path "$dir/logs/error.log") {
              Copy-Item "$dir/logs/error.log" "smoke-$name.log"
              Write-Host "::warning::$name wrote error.log"
              Get-Content "$dir/logs/error.log" | Out-Host
            }
            if ($alive) {
              [void]$p.CloseMainWindow()
              if (-not $p.WaitForExit(15000)) { Stop-Process -Id $p.Id -Force; $script:checks += "| $name closes within 15 s | FAIL | had to be killed |"; Write-Host "::warning::$name didn't exit after closing" }
            }
            else { Write-Host "::error::$name exited early with code $($p.ExitCode)" }
            $loaded = (Test-Path $report) -and (Get-Content $report -Raw | ConvertFrom-Json).firstNavigationSucceeded
            if (-not $loaded) { Write-Host "::error::$name first page did not load" }
            if (-not $alive -or -not $loaded -or (Test-Path "$dir/logs/error.log")) { $script:failed += $name }
            Write-Host "$name alive=$alive report=$(Test-Path $report)"
            return $dir
          }
          function Extensions([string]$name) {
            if (Test-Path "smoke-$name.json") { @((Get-Content "smoke-$name.json" -Raw | ConvertFrom-Json).extensions) } else { @() }
          }

          [void](Smoke 'newtab' @() -settle 25)
          $ubol = Extensions 'newtab'
          Check 'uBlock Origin Lite installed' ([bool]($ubol -match 'uBlock')) ($ubol -join '; ')
          [void](Smoke 'dusk-page' @('--url', 'https://example.com'))
          # The themes copied to a scratch file, so Customize-panel saves can't touch the build output.
          foreach ($t in 'glass', 'light') { Copy-Item "out/Lilt/Themes/$t.json" (Join-Path $env:RUNNER_TEMP "$t.json") }
          [void](Smoke 'light-page' @('--theme', "`"$env:RUNNER_TEMP\light.json`"", '--url', 'https://example.com'))
          [void](Smoke 'light-home' @('--theme', "`"$env:RUNNER_TEMP\light.json`""))
          [void](Smoke 'glass-home' @('--theme', "`"$env:RUNNER_TEMP\glass.json`""))
          $glass = if (Test-Path 'smoke-glass-home.json') { (Get-Content 'smoke-glass-home.json' -Raw | ConvertFrom-Json).backdrop } else { '' }
          Check 'Glass theme gets its acrylic material' ($glass -like 'Acrylic*') "backdrop: $glass"

          # Efficiency mode: cover Lilt with a full-screen window (like a game), then minimize it; it should pause
          # (hide and suspend pages, EcoQoS) and come back to normal each time it's in front again.
          $dir = Smoke 'power' @('--url', 'https://example.com') {
            param($p)
            $p.Refresh()
            $cover = @'
          Add-Type -AssemblyName System.Windows.Forms
          $f = New-Object System.Windows.Forms.Form
          $f.FormBorderStyle = 'None'; $f.WindowState = 'Maximized'; $f.TopMost = $true; $f.BackColor = 'Black'; $f.Text = 'Game'
          $t = New-Object System.Windows.Forms.Timer; $t.Interval = 40000; $t.Add_Tick({ $f.Close() }); $t.Start()
          [System.Windows.Forms.Application]::Run($f)
          '@
            $coverFile = Join-Path $env:RUNNER_TEMP 'cover.ps1'
            Set-Content $coverFile $cover
            $c = Start-Process pwsh -ArgumentList '-NoProfile', '-File', "`"$coverFile`"" -PassThru
            Start-Sleep -Seconds 38
            try { Shot 'screenshot-power-covered.png' } catch { }
            $c.WaitForExit(15000) | Out-Null
            [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle)
            Start-Sleep -Seconds 3
            [void][Lilt.Input]::ShowWindow($p.MainWindowHandle, 6)
            Start-Sleep -Seconds 30
            [void][Lilt.Input]::ShowWindow($p.MainWindowHandle, 9)
            [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle)
            Start-Sleep -Seconds 3
          }
          $dir = @($dir)[-1]
          $power = if (Test-Path "$dir/startup.json.keys.txt") { @(Get-Content "$dir/startup.json.keys.txt" | Where-Object { $_ -match ' power ' }) } else { @() }
          if ($power) { $power | Set-Content 'smoke-power.txt' }
          Check 'Efficiency mode pauses behind a full-screen window and when minimized' (($power -match 'power paused').Count -ge 2) ($power -join ' / ')
          Check 'Paused pages get suspended' ([bool]($power -match 'suspended')) ($power -join ' / ')
          Check 'Efficiency mode returns to normal in front' ([bool]($power[-1] -match 'power full')) "last: $(if ($power) { $power[-1] } else { 'none' })"
          # A user script (Lilt's per-site JS) scrolls the tester to its score so the screenshot shows it.
          $userDir = Join-Path $env:RUNNER_TEMP 'lilt-adblock-test/user'
          New-Item -ItemType Directory $userDir -Force | Out-Null
          Set-Content (Join-Path $userDir 'adblock-tester.com.js') @'
          addEventListener('load', () => setTimeout(() => {
            document.documentElement.style.zoom = '0.6';
            const el = [...document.querySelectorAll('h1,h2,h3,h4,p,div,span')].find(e => /your score|points/i.test(e.textContent) && e.children.length < 3);
            (el || document.body).scrollIntoView({ block: 'start' });
          }, 12000));
          '@
          [void](Smoke 'adblock-test' @('--url', 'https://adblock-tester.com/') -settle 22 -warm)

          # From the home tab (address box focused): Ctrl+T as a XAML accelerator, then type a site into the new tab,
          # click into that page and press Ctrl+T again (the in-page key shim). Closing should save three tabs.
          $dir = Smoke 'keys-session' @() {
            param($p)
            $p.Refresh()
            [void][Lilt.Input]::SetForegroundWindow($p.MainWindowHandle)
            Start-Sleep -Seconds 1
            [System.Windows.Forms.SendKeys]::SendWait('^t')
            Start-Sleep -Seconds 3
            [System.Windows.Forms.SendKeys]::SendWait('example.com{ENTER}')
            Start-Sleep -Seconds 5
            [void][Lilt.Input]::SetCursorPos(640, 420)
            [Lilt.Input]::mouse_event(2, 0, 0, 0, 0); [Lilt.Input]::mouse_event(4, 0, 0, 0, 0)
            Start-Sleep -Seconds 1
            [System.Windows.Forms.SendKeys]::SendWait('^t')
            Start-Sleep -Seconds 3
          }
          $dir = @($dir)[-1]
          $keys = if (Test-Path "$dir/startup.json.keys.txt") { Get-Content "$dir/startup.json.keys.txt" } else { @() }
          $session = if (Test-Path "$dir/session.json") { Get-Content "$dir/session.json" -Raw | ConvertFrom-Json } else { $null }
          if ($session) { Copy-Item "$dir/session.json" 'smoke-keys-session.session.json' }
          $urls = if ($session) { ($session.tabs | ForEach-Object url) -join ', ' } else { 'no session.json' }
          Check 'Ctrl+T from the address box (XAML)' ([bool]($keys -match 'xaml newTab')) "keys: $($keys -join ' / ')"
          Check 'Ctrl+T from inside a page (key shim)' ([bool]($keys -match 'page newTab')) "keys: $($keys -join ' / ')"
          Check 'Session saved on close' ($session -and $session.tabs.Count -eq 3) "tabs: $urls"

          [void](Smoke 'proton-pass' @('--install-extension', 'ghmbeldphafepmbegfdlkpapadhbakde') -settle 4)
          $pp = Extensions 'proton-pass'
          Check 'Proton Pass installs from the Chrome Web Store' ([bool]($pp -match 'Proton')) ($pp -join '; ')

          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 2; StartTime = (Get-Date).AddMinutes(-20) } -ErrorAction SilentlyContinue |
            Format-List TimeCreated, ProviderName, Message | Out-File smoke-events.log
          @('### Feature checks', '', '| Check | Result | Detail |', '|---|---|---|') + $script:checks | Tee-Object smoke-checks.md | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($script:failed.Count) { Write-Host "::error::Smoke test failed: $($script:failed -join ', ')"; exit 1 }

      - name: Publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'prototype-build'
          gh release delete $tag --yes --cleanup-tag 2>$null
          $files = @('Lilt-win-x64.zip', 'size.txt') + @(Get-ChildItem screenshot-*.png, measure-*.json, measure-*.md, smoke-*.json, smoke-*.log, smoke-*.md, smoke-*.txt -ErrorAction SilentlyContinue | ForEach-Object Name)
          # Recreating a just-deleted tag sometimes fails for a few seconds; retry.
          foreach ($try in 1..5) {
            gh release create $tag --prerelease --target $env:GITHUB_SHA --title "Lilt prototype build $($env:GITHUB_SHA.Substring(0, 7))" --notes "Built by CI from $env:GITHUB_SHA on $env:GITHUB_REF_NAME. Unzip anywhere and run Lilt.exe (Windows 11 x64)." @files
            if ($LASTEXITCODE -eq 0) { exit 0 }
            gh release delete $tag --yes --cleanup-tag 2>$null
            Start-Sleep -Seconds (10 * $try)
          }
          exit 1

      - name: Idle measurements
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 30
        run: |
          # Each scenario runs in its own process with a hard time limit, so one stuck run can't hold up the rest.
          # (Not named Measure: that's an alias for Measure-Object, and aliases win over functions.)
          function Invoke-Scenario([string]$out, [string[]]$a) {
            $argList = @('-NoProfile', '-File', 'tools/measure.ps1', '-Exe', 'out/Lilt/Lilt.exe', '-Runs', '3', '-Settle', '20', '-Sample', '30', '-Out', $out) + $a
            $m = Start-Process pwsh -ArgumentList $argList -NoNewWindow -PassThru
            if (-not $m.WaitForExit(480000)) {
              Write-Host "::warning::$out timed out"
              Stop-Process -Id $m.Id -Force -ErrorAction SilentlyContinue
              Get-Process Lilt, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          }
          Invoke-Scenario measure-visible.json @('-Label', '"CI runner, about:blank, first start"')
          Invoke-Scenario measure-noext.json @('-Label', '"CI runner, about:blank, no extensions"', '-ExtraArgs', '--no-extensions')
          # A page that animates continuously (WebGL; software-rendered on this GPU-less VM), so background savings show up.
          $page = 'https://threejs.org/examples/webgl_animation_keyframes.html'
          $off = Join-Path $env:RUNNER_TEMP 'efficiency-off.json'
          (Get-Content out/Lilt/Themes/minimal.json -Raw) -replace '"efficiency": true', '"efficiency": false' | Set-Content $off
          Invoke-Scenario measure-front.json @('-Url', $page, '-Warm', '-Label', '"CI runner, animated page, in front"')
          Invoke-Scenario measure-covered.json @('-Url', $page, '-Warm', '-Cover', '-Label', '"CI runner, animated page, behind a full-screen window, efficiency mode on"')
          Invoke-Scenario measure-covered-off.json @('-Url', $page, '-Warm', '-Cover', '-Theme', "`"$off`"", '-Label', '"CI runner, animated page, behind a full-screen window, efficiency mode off"')
          Get-Content measure-*.md -ErrorAction SilentlyContinue | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Add measurements to the release
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem measure-*.json, measure-*.md -ErrorAction SilentlyContinue | ForEach-Object Name)
          if ($files) { gh release upload prototype-build @files --clobber }

      - name: Upload log on failure
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete prototype-log --yes --cleanup-tag 2>$null
          if (-not (Test-Path build.log)) { 'No build log (failure before publish).' | Set-Content build.log }
          $files = @('build.log') + @(Get-ChildItem screenshot-*.png, smoke-*.json, smoke-*.log, smoke-*.txt, smoke-*.md -ErrorAction SilentlyContinue | ForEach-Object Name)
          foreach ($try in 1..5) {
            gh release create prototype-log --prerelease --target $env:GITHUB_SHA --title "CI log $($env:GITHUB_SHA.Substring(0, 7))" --notes "Failed run $env:GITHUB_RUN_ID" @files
            if ($LASTEXITCODE -eq 0) { exit 0 }
            gh release delete prototype-log --yes --cleanup-tag 2>$null
            Start-Sleep -Seconds (10 * $try)
          }
          exit 1
